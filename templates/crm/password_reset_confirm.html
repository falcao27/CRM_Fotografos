{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha - CRM Cloud</title>
  <link rel="stylesheet" href="{% static 'crm/styles.css' %}?v=20260618-mobile-fit">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell auth-shell-pro">
    <section class="auth-panel auth-panel-pro">
      <div class="auth-logo"><span class="brand-mark">C</span><div><strong>CRM Cloud</strong><small>Defina uma nova senha</small></div></div>
      {% if validlink %}
        <h1>Nova senha</h1>
        <form method="post" class="auth-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="button auth-submit" type="submit"><i data-lucide="key-round"></i>Salvar senha</button>
        </form>
      {% else %}
        <h1>Link expirado</h1>
        <p>Solicite uma nova recuperacao de senha.</p>
        <a class="button auth-submit" href="{% url 'password_reset' %}">Solicitar novo link</a>
      {% endif %}
    </section>
  </main>
  <script>window.addEventListener("DOMContentLoaded", function () { if (window.lucide) window.lucide.createIcons(); });</script>
</body>
</html>
