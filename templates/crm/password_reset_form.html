{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha - CRM Cloud</title>
  <link rel="stylesheet" href="{% static 'crm/styles.css' %}?v=auth-20260613-secure">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell auth-shell-pro">
    <section class="auth-panel auth-panel-pro">
      <div class="auth-logo"><span class="brand-mark">C</span><div><strong>CRM Cloud</strong><small>Recuperacao segura</small></div></div>
      <div class="auth-heading">
        <h1>Esqueci minha senha</h1>
        <p>Informe o email cadastrado para receber o link de redefinicao.</p>
      </div>
      <form method="post" class="auth-form">
        {% csrf_token %}
        <label for="id_email">Email</label>
        {{ form.email }}
        <button class="button auth-submit" type="submit"><i data-lucide="mail"></i>Enviar link</button>
      </form>
      <a class="auth-link" href="{% url 'login' %}">Voltar para login</a>
    </section>
  </main>
  <script>window.addEventListener("DOMContentLoaded", function () { if (window.lucide) window.lucide.createIcons(); });</script>
</body>
</html>
