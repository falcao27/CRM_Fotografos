{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - CRM </title>
  <link rel="stylesheet" href="{% static 'crm/styles.css' %}?v=auth-20260609">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel auth-panel-wide">
      <div class="auth-logo auth-brand">
        <span class="brand-mark">C</span>
        <div>
          <strong>CRM </strong>
          <small>Cadastro de empresa</small>
        </div>
      </div>
      <h1>Cadastrar empresa</h1>
      <p>Crie o primeiro usuario administrador da empresa.</p>

      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="post" class="auth-form auth-form-grid">
        {% csrf_token %}
        <label for="id_empresa">Empresa</label>
        <input id="id_empresa" name="empresa" required>
        <label for="id_nome">Nome do responsavel</label>
        <input id="id_nome" name="nome" required>
        <label for="id_email">Email</label>
        <input id="id_email" name="email" type="email">
        <label for="id_username">Usuario</label>
        <input id="id_username" name="username" autocomplete="username" required>
        <label for="id_password">Senha</label>
        <input id="id_password" name="password" type="password" autocomplete="new-password" required>
        <button class="button auth-submit" type="submit"><i data-lucide="building-2"></i>Criar acesso</button>
      </form>

      <a class="auth-link" href="{% url 'login' %}">Voltar para login</a>
    </section>
  </main>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
