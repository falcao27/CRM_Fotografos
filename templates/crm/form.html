{% extends "base.html" %}

{% block page_title %}{{ titulo }}{% endblock %}
{% block page_subtitle %}Preencha os dados e salve para atualizar o banco.{% endblock %}

{% block content %}
<section class="form-panel">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="form-grid">
      {% for field in form %}
        <label class="{% if field.field.widget.input_type == 'textarea' %}wide{% endif %}{% if field.name == 'nome_indicacao' or field.name == 'quantidade_parcelas' or field.name == 'primeira_parcela' or field.name == 'valor_estimado' or field.name == 'valor_negociado' %} conditional-field{% endif %}"{% if field.name == 'nome_indicacao' %} data-field="nome-indicacao"{% elif field.name == 'quantidade_parcelas' %} data-field="quantidade-parcelas"{% elif field.name == 'primeira_parcela' %} data-field="primeira-parcela"{% elif field.name == 'valor_estimado' %} data-field="valor-orcamento"{% elif field.name == 'valor_negociado' %} data-field="valor-negociacao"{% endif %}>
          <span>{{ field.label }}</span>
          {{ field }}
          {% if field.name == "nome" and form.clientes_opcoes %}
            <datalist id="clientes-cadastrados">
              {% for cliente in form.clientes_opcoes %}
                <option value="{{ cliente.nome }}" label="{% if cliente.telefone %}{{ cliente.telefone }}{% else %}Cliente cadastrado{% endif %}"></option>
              {% endfor %}
            </datalist>
          {% endif %}
          {% if field.name == "tipo_evento" and form.tipo_evento_opcoes %}
            <datalist id="tipos-evento-cadastrados">
              {% for tipo_evento in form.tipo_evento_opcoes %}
                <option value="{{ tipo_evento }}"></option>
              {% endfor %}
            </datalist>
          {% endif %}
          {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
          {% for error in field.errors %}<em>{{ error }}</em>{% endfor %}
        </label>
      {% endfor %}
    </div>
    <div class="row-actions">
      <button class="button" type="submit"><i data-lucide="save"></i>Salvar</button>
      <a class="button ghost" href="{% url voltar %}">Voltar</a>
    </div>
  </form>
</section>

<script>
  window.addEventListener("DOMContentLoaded", function () {
    const prospeccao = document.getElementById("id_titulo");
    const indicacao = document.querySelector('[data-field="nome-indicacao"]');
    const nome = document.getElementById("id_nome");
    const contato = document.getElementById("id_contato");
    const formaPagamento = document.getElementById("id_forma_pagamento");
    const etapa = document.getElementById("id_etapa");
    const dataEvento = document.getElementById("id_data_evento");
    const proximaOportunidade = document.getElementById("id_proxima_oportunidade");
    const parcelas = document.querySelector('[data-field="quantidade-parcelas"]');
    const primeiraParcela = document.querySelector('[data-field="primeira-parcela"]');
    const valorOrcamento = document.querySelector('[data-field="valor-orcamento"]');
    const valorNegociacao = document.querySelector('[data-field="valor-negociacao"]');
    const clientes = {
      {% if form.clientes_opcoes %}
        {% for cliente in form.clientes_opcoes %}
          "{{ cliente.nome|escapejs }}": "{{ cliente.telefone|escapejs }}"{% if not forloop.last %},{% endif %}
        {% endfor %}
      {% endif %}
    };

    function alternarIndicacao() {
      if (!prospeccao || !indicacao) return;
      const exibir = prospeccao.value === "Indicacao";
      indicacao.classList.toggle("is-hidden", !exibir);
      const campo = indicacao.querySelector("input, select, textarea");
      if (campo) campo.required = exibir;
    }

    function preencherContato() {
      if (!nome || !contato || contato.value) return;
      const telefone = clientes[nome.value];
      if (telefone) contato.value = telefone;
    }

    function alternarParcelas() {
      if (!formaPagamento || !parcelas) return;
      const exibir = ["boleto", "cartao"].includes(formaPagamento.value);
      parcelas.classList.toggle("is-hidden", !exibir);
      if (primeiraParcela) primeiraParcela.classList.toggle("is-hidden", !exibir);
      const campo = parcelas.querySelector("input, select, textarea");
      if (campo && !exibir) campo.value = 1;
    }

    function alternarValoresOportunidade() {
      if (!etapa || !valorOrcamento) return;

      const exibirOrcamento = ["orcamento", "negociacao"].includes(etapa.value);
      const exibirNegociacao = etapa.value === "negociacao";
      const campoOrcamento = valorOrcamento.querySelector("input, select, textarea");
      const campoNegociacao = valorNegociacao ? valorNegociacao.querySelector("input, select, textarea") : null;

      valorOrcamento.classList.toggle("is-hidden", !exibirOrcamento);
      if (valorNegociacao) valorNegociacao.classList.toggle("is-hidden", !exibirNegociacao);

      if (campoOrcamento) {
        campoOrcamento.required = exibirOrcamento;
        campoOrcamento.readOnly = exibirNegociacao && Boolean(campoOrcamento.value);
      }
      if (campoNegociacao) {
        campoNegociacao.required = exibirNegociacao;
      }
    }

    function formatarDataInput(data) {
      const ano = data.getFullYear();
      const mes = String(data.getMonth() + 1).padStart(2, "0");
      const dia = String(data.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function subtrairMeses(data, meses) {
      const diaOriginal = data.getDate();
      const resultado = new Date(data.getFullYear(), data.getMonth() - meses, 1);
      const ultimoDia = new Date(resultado.getFullYear(), resultado.getMonth() + 1, 0).getDate();
      resultado.setDate(Math.min(diaOriginal, ultimoDia));
      return resultado;
    }

    function preencherProximaOportunidade() {
      if (!dataEvento || !proximaOportunidade || !dataEvento.value) return;
      const partes = dataEvento.value.split("-").map(Number);
      const data = new Date(partes[0], partes[1] - 1, partes[2]);
      proximaOportunidade.value = formatarDataInput(subtrairMeses(new Date(partes[0] + 1, partes[1] - 1, partes[2]), 2));
    }

    alternarIndicacao();
    alternarParcelas();
    alternarValoresOportunidade();
    preencherProximaOportunidade();
    if (prospeccao) prospeccao.addEventListener("change", alternarIndicacao);
    if (formaPagamento) formaPagamento.addEventListener("change", alternarParcelas);
    if (etapa) etapa.addEventListener("change", alternarValoresOportunidade);
    if (dataEvento) dataEvento.addEventListener("change", preencherProximaOportunidade);
    if (nome) nome.addEventListener("change", preencherContato);
  });
</script>
{% endblock %}
